name = "nsw-hifi"
account_id = "4219a576830c72b0e6e4ca358e61473a"
main = "worker.js"
compatibility_date = "2026-06-16"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "hifi.nates-software.com", custom_domain = true },
  { pattern = "hifi.nates-software.com/*", zone_name = "nates-software.com" }
]
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# The Mac download counter (worker.js Downloads).
[[durable_objects.bindings]]
name = "DOWNLOADS"
class_name = "Downloads"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Downloads"]

# Nate's Taste Makers: TestFlight signups. ios/scripts/tastemakers.py adds them to the group.
[[d1_databases]]
binding = "DB"
database_name = "nsw-hifi"
database_id = "62be806d-d671-4808-ad84-263809cca29f"
