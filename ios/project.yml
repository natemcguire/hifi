name: HIFI
options:
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 42Y5ADDZL2
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: '1.0.4'
    CURRENT_PROJECT_VERSION: '2'
    PRODUCT_NAME: HIFI
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HIFI
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  HIFI:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
      - path: ../stations.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natesoftware.hifi
        PROVISIONING_PROFILE_SPECIFIER: HIFI iPhone Development
        TARGETED_DEVICE_FAMILY: '1,2'
        # iPhone and iPad only: no Mac Catalyst, no "Designed for iPad" Mac or Vision builds.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Config/Info.plist
      properties:
        UIBackgroundModes: [audio]
        CFBundleDisplayName: HIFI
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # nswhifi:// brings Spotify's sign-in back to the app, even when the
        # browser doing the sign-in (Chrome, say) opens it as a plain link.
        CFBundleURLTypes:
          - CFBundleURLName: com.natesoftware.hifi.spotify
            CFBundleURLSchemes: [nswhifi]
