<template>
  <style>

    .ground { position: absolute; inset: 0; }
    #st-day { background: radial-gradient(1200px 900px at 70% 45%, #ffffff 0%, #f5f5f7 55%, #ececf0 100%); }
    #st-night { background: linear-gradient(#1c1d2b, #2a2c40); opacity: 0; }

    #st-device { position: absolute; left: 1055px; top: 100px; width: 550px; height: 880px; border-radius: 64px; overflow: hidden;
      box-shadow: 0 0 0 1.5px rgba(0,0,0,.08), 0 50px 90px -30px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.9) inset; background: #e9eaec; }
    #st-device img { position: absolute; left: 0; top: 0; width: 550px; height: 880px; opacity: 0; }

      background: radial-gradient(circle at 50% 45%, rgba(40,40,48,.22), rgba(40,40,48,.32));
      box-shadow: 0 0 0 2.5px rgba(255,255,255,.95), 0 6px 18px rgba(0,0,0,.22); }
    #st-tip { left: 0; top: -129px; }
    #st-press { left: 275px; top: 655px; }

    .line { position: absolute; left: 170px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
    .line span { display: inline-block; opacity: 0; margin-right: 0.22em; }
    #st-l1 { top: 330px; font-size: 118px; }
    #st-l2 { top: 462px; font-size: 118px; }
    #st-sub { position: absolute; left: 174px; top: 628px; font-size: 38px; font-weight: 500; color: #6e6e73; letter-spacing: -0.01em; opacity: 0; }

    #st-act2 { position: absolute; left: 0; right: 0; top: 104px; text-align: center; color: #f5f5f7; font-size: 60px; font-weight: 800; letter-spacing: -0.035em; }
    #st-act2 span { display: inline-block; opacity: 0; margin: 0 0.12em; }
    .phone { position: absolute; top: 214px; width: 313px; height: 680px; border-radius: 30px; opacity: 0;
      box-shadow: 0 40px 70px -25px rgba(0,0,0,.7); }
    #st-p1 { left: 720px; } #st-p2 { left: 1061px; } #st-p3 { left: 1402px; }

    #st-end { position: absolute; left: 170px; top: 360px; }
    #st-mark { display: flex; align-items: center; gap: 26px; font-size: 150px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
    #st-mark b { display: inline-block; opacity: 0; }
    /* The brand's own mark from the landing page: a tiny white iPod, screen over wheel. */
    #st-icon { position: relative; width: 84px; height: 126px; border-radius: 20px; background: linear-gradient(#fff, #dcdde0); box-shadow: 0 0 0 4px #b9bcc0; opacity: 0; }
    #st-icon i { position: absolute; left: 15px; right: 15px; top: 15px; height: 37px; border-radius: 5px; background: #1d1f21; }
    #st-icon u { position: absolute; left: 21px; bottom: 15px; width: 42px; height: 42px; border-radius: 50%; background: #e4e5e7; box-shadow: inset 0 0 0 13px #f8f8f8, 0 0 0 4px #c9cbce; }
    #st-url { margin-top: 40px; font-size: 50px; font-weight: 700; color: #0071e3; letter-spacing: -0.015em; opacity: 0; }
    #st-free { margin-top: 14px; font-size: 36px; font-weight: 500; color: #6e6e73; opacity: 0; }
  </style>
  <div
    id="root"
    data-composition-id="stage"
    data-width="1920"
    data-height="1080"
    data-composition-variables='[{"id":"sub","type":"string","label":"Line under the title","default":"Spin the wheel. It’s already on."},{"id":"url","type":"string","label":"Address","default":"hifi.nates-software.com"},{"id":"free","type":"string","label":"End line","default":"Free. Browser, iPhone and Mac."}]'
  >
    <div id="st-day" class="ground"></div>
    <div id="st-night" class="ground"></div>

    <div id="st-l1" class="line"><span id="w1">Little</span><span id="w2">radio.</span></div>
    <div id="st-l2" class="line"><span id="w3">Very</span><span id="w4">big</span><span id="w5">mood.</span></div>
    <p id="st-sub" data-var-text="sub">Spin the wheel. It’s already on.</p>

    <div id="st-act2"><span id="a1">Browser.</span><span id="a2">iPhone.</span><span id="a3">Mac.</span></div>
    <img id="st-p1" class="phone" src="assets/phones/3-radio.webp" alt="" />
    <img id="st-p2" class="phone" src="assets/phones/2-live.webp" alt="" />
    <img id="st-p3" class="phone" src="assets/phones/6-synth.webp" alt="" />

    <div id="st-device" data-layout-allow-overlap>
      <img id="f-main-0" src="assets/frames/main-0.png" alt="" />
      <img id="f-main-1" src="assets/frames/main-1.png" alt="" />
      <img id="f-main-2" src="assets/frames/main-2.png" alt="" />
      <img id="f-synth-0" src="assets/frames/synth-0.png" alt="" />
      <img id="f-synth-1" src="assets/frames/synth-1.png" alt="" />
      <img id="f-np-0" src="assets/frames/np-0.png" alt="" />
      <img id="f-np-1" src="assets/frames/np-1.png" alt="" />
      <img id="f-np-2" src="assets/frames/np-2.png" alt="" />
      <img id="f-np-3" src="assets/frames/np-3.png" alt="" />
      <img id="f-np-4" src="assets/frames/np-4.png" alt="" />
      <img id="f-np-5" src="assets/frames/np-5.png" alt="" />
      <img id="f-np-6" src="assets/frames/np-6.png" alt="" />
      <img id="f-np-7" src="assets/frames/np-7.png" alt="" />
      <img id="f-home" src="assets/frames/home.png" alt="" />
      <div id="st-spin"><div id="st-tip" class="tip"></div></div>
      <div id="st-press" class="tip"></div>
    </div>

    <div id="st-end">
      <div id="st-mark"><span id="st-icon"><i></i><u></u></span><span><b id="m1">H</b><b id="m2">I</b><b id="m3">F</b><b id="m4">I</b></span></div>
      <p id="st-url" data-var-text="url">hifi.nates-software.com</p>
      <p id="st-free" data-var-text="free">Free. Browser, iPhone and Mac.</p>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Screen states, each held until the next one. The Now Playing clock reads
    // 0:03 in np-0 and one second more in each after, matching the music, which
    // starts at 0:00 with the film.
    const frames = [
      ["main-0", 0], ["main-1", 0.85], ["main-2", 1.3],
      ["synth-0", 1.98], ["synth-1", 2.58],
      ["np-0", 3.12], ["np-1", 4], ["np-2", 5], ["np-3", 6], ["np-4", 7], ["np-5", 8], ["np-6", 9], ["np-7", 10],
    ];
    frames.forEach(([id, at], i) => {
      if (i > 0) tl.set("#f-" + id, { opacity: 1 }, at);
      const next = frames[i + 1];
      if (next) tl.set("#f-" + id, { opacity: 0 }, next[1]);
    });

    // A fingertip turns the wheel clockwise, one detent per row.
    const touch = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power3.out" }, at);
    const lift = (sel, at) => tl.to(sel, { opacity: 0, scale: 1.15, duration: 0.1, ease: "power2.in" }, at);
    const press = (at) => {
      touch("#st-press", at);
      tl.to("#st-press", { scale: 0.86, duration: 0.08, ease: "power2.in" }, at + 0.14)
        .to("#st-press", { scale: 1, duration: 0.14, ease: "power3.out" }, at + 0.22);
      lift("#st-press", at + 0.38);
    };
    tl.set("#st-spin", { rotation: 55 }, 0);
    touch("#st-tip", 0.3);
    tl.to("#st-spin", { rotation: 150, duration: 1.15, ease: "power1.inOut" }, 0.42);
    lift("#st-tip", 1.6);
    press(1.74);
    tl.set("#st-spin", { rotation: 150 }, 2.2);
    touch("#st-tip", 2.22);
    tl.to("#st-spin", { rotation: 195, duration: 0.42, ease: "power1.inOut" }, 2.34);
    lift("#st-tip", 2.78);
    press(2.88);

    // Act 1 type: per-word blur in, then per-word grey to ink.
    ["#w1", "#w2"].forEach((w, i) => tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 0.4 + i * 0.067));
    ["#w3", "#w4", "#w5"].forEach((w, i) => {
      tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 3.3 + i * 0.09);
      tl.fromTo(w, { color: "#d2d2d7" }, { color: "#1d1d1f", duration: 0.32, ease: "power2.out" }, 3.3 + i * 0.09);
    });
    tl.fromTo("#st-sub", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 4.35);
    ["#w1", "#w2", "#w3", "#w4", "#w5"].forEach((w, i) => tl.to(w, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 6.55 + i * 0.04));
    tl.to("#st-sub", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 6.6);

    // Act 2: the ground floods to night, the iPod steps aside, the iPhone app rises in.
    tl.to("#st-night", { opacity: 1, duration: 0.42, ease: "power2.inOut" }, 6.8);
    tl.to("#st-device", { x: -930, scale: 0.85, duration: 0.8, ease: "power2.inOut" }, 6.72);
    ["#st-p1", "#st-p2", "#st-p3"].forEach((p, i) => tl.fromTo(p, { opacity: 0, y: 560 }, { opacity: 1, y: 0, duration: 0.75, ease: "expo.out" }, 7.12 + i * 0.08));
    ["#a1", "#a2", "#a3"].forEach((w, i) => tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 7.45 + i * 0.12));

    // Back home: phones drop away, day returns, the iPod slides back to its menu.
    ["#st-p3", "#st-p2", "#st-p1"].forEach((p, i) => { tl.to(p, { y: 620, duration: 0.38, ease: "power3.in" }, 9.42 + i * 0.05); tl.set(p, { opacity: 0 }, 9.85 + i * 0.05); });
    ["#a1", "#a2", "#a3"].forEach((w, i) => tl.to(w, { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: "power2.in" }, 9.4 + i * 0.04));
    tl.to("#st-night", { opacity: 0, duration: 0.42, ease: "power2.inOut" }, 9.62);
    tl.to("#st-device", { x: 0, scale: 1, duration: 0.8, ease: "power2.inOut" }, 9.5);
    tl.fromTo("#f-home", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 9.9);

    // End card: the mark, then the address, held, then gone so the last frame is the first.
    tl.fromTo("#st-icon", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 10.05);
    ["#m1", "#m2", "#m3", "#m4"].forEach((m, i) => tl.fromTo(m, { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, 10.12 + i * 0.1));
    tl.fromTo("#st-url", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 10.5);
    tl.fromTo("#st-free", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 10.6);
    tl.to(["#st-icon", "#m1", "#m2", "#m3", "#m4", "#st-url", "#st-free"], { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in", stagger: 0.02 }, 12.5);

    window.__timelines["stage"] = tl;
  </script>
</template>
